# dnsmasq: DNS autoritativo da zona vinheria.local + servidor DHCP da simulação
domain-needed
bogus-priv
no-hosts
expand-hosts
domain=vinheria.local
local=/vinheria.local/
interface=eth0
# repassa os nomes que não são da zona interna para o DNS do Docker (que resolve a Internet)
server=127.0.0.11

# registros A dos hosts internos
addn-hosts=/etc/dnsmasq.d/hosts.vinheria

# arquivos extras (.conf) em /etc/dnsmasq.d: reservas DHCP
conf-dir=/etc/dnsmasq.d/,*.conf

# alias (CNAME) — www.vinheria.local aponta para o Catálogo
cname=www.vinheria.local,catalogo.vinheria.local

# ---- DHCP ----
dhcp-range=172.28.0.100,172.28.0.200,255.255.255.0,12h
dhcp-option=option:router,172.28.0.1
dhcp-option=option:dns-server,172.28.0.53
dhcp-option=option:domain-name,vinheria.local
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
dhcp-authoritative
# respostas em broadcast: o cliente DHCP ainda não tem IP, então o ACK unicast seria descartado
dhcp-broadcast
dhcp-hostsfile=/etc/dhcp-hosts.conf
